<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PromptVault</title>
  <style>
    :root {
      --bg:     #0b0b13;
      --surf:   #101020;
      --raised: #16162c;
      --hover:  #1c1c34;
      --border: #22223c;
      --acc:    #7c6af7;
      --acc-l:  #9585f9;
      --acc-d:  rgba(124, 106, 247, 0.13);
      --text:   #e2e3f0;
      --mid:    #8a8aac;
      --lo:     #525268;
      --ok:     #34c78e;
      --err:    #e05c6e;
      --r:      8px;
      --t:      0.14s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      background: var(--surf);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .logo-bolt { margin-right: 5px; }

    .hd-count {
      font-size: 11px;
      color: var(--lo);
      background: var(--raised);
      padding: 2px 8px;
      border-radius: 99px;
    }

    /* ── Search ─────────────────────────────────────────────── */
    .search-wrap {
      position: relative;
      padding: 10px 12px 8px;
      background: var(--surf);
      border-bottom: 1px solid var(--border);
    }

    .search-icon {
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--lo);
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: 7px 10px 7px 30px;
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-family: inherit;
      font-size: 12.5px;
      outline: none;
      transition: border-color var(--t);
    }

    #search::placeholder { color: var(--lo); }
    #search:focus { border-color: #5248a0; }

    /* ── Prompt list ────────────────────────────────────────── */
    .list-wrap {
      max-height: 320px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    ::-webkit-scrollbar             { width: 4px; }
    ::-webkit-scrollbar-track       { background: transparent; }
    ::-webkit-scrollbar-thumb       { background: var(--border); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #5248a0; }

    .item {
      position: relative;
      overflow: hidden;
      padding: 10px 12px;
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: var(--r);
      cursor: pointer;
      transition: background var(--t), border-color var(--t);
    }

    .item:hover          { background: var(--hover); border-color: var(--acc); }
    .item.loading        { opacity: 0.45; pointer-events: none; }
    .item.success        { border-color: var(--ok); }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 3px;
    }

    .item-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 99px;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }

    .badge-claude { background: rgba(124,106,247,0.15); color: #a090f8; }
    .badge-gpt    { background: rgba(52,199,142,0.14);  color: #34c78e; }
    .badge-gemini { background: rgba(66,133,244,0.14);  color: #60a5fa; }

    .item-preview {
      font-size: 11.5px;
      color: var(--mid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Success overlay flash */
    .item-flash {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(52, 199, 142, 0.1);
      color: var(--ok);
      font-size: 12.5px;
      font-weight: 600;
      opacity: 0;
      transition: opacity var(--t);
      pointer-events: none;
    }

    .item.success .item-flash { opacity: 1; }

    /* ── Empty state ────────────────────────────────────────── */
    .empty {
      padding: 28px 16px;
      text-align: center;
      color: var(--lo);
      font-size: 12.5px;
      line-height: 1.7;
    }

    .empty a { color: var(--acc); text-decoration: none; }
    .empty a:hover { text-decoration: underline; }

    /* ── Status bar ─────────────────────────────────────────── */
    .status-bar {
      min-height: 26px;
      padding: 4px 16px;
      font-size: 12px;
      display: flex;
      align-items: center;
    }

    .status-bar.ok  { color: var(--ok); }
    .status-bar.err { color: var(--err); }

    /* ── Footer ─────────────────────────────────────────────── */
    .ft {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 16px;
      border-top: 1px solid var(--border);
      background: var(--surf);
    }

    .open-link {
      font-size: 12px;
      color: var(--mid);
      text-decoration: none;
      transition: color var(--t);
    }

    .open-link:hover { color: var(--acc-l); }

    .ft-hint {
      font-size: 11px;
      color: var(--lo);
    }
  </style>
</head>
<body>

  <header class="hd">
    <span class="logo"><span class="logo-bolt">⚡</span>PromptVault</span>
    <span class="hd-count" id="count">0 prompts</span>
  </header>

  <div class="search-wrap">
    <svg class="search-icon" width="13" height="13" viewBox="0 0 16 16" fill="none">
      <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>
      <line x1="10.8" y1="10.8" x2="14" y2="14" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input id="search" type="text" placeholder="Search prompts…" autocomplete="off" />
  </div>

  <div class="list-wrap" id="list"></div>

  <div class="status-bar" id="status"></div>

  <footer class="ft">
    <a class="open-link" id="open-app" href="#">Open PromptVault ↗</a>
    <span class="ft-hint">Click a prompt to inject</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
